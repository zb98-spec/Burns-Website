{% extends "base.html" %}

{% block title %}Burns Dashboard{% endblock %}

{% block content %}
  <h1>Projects</h1>
  <div class="tile-grid">
    {% for project in projects %}
      <a class="tile tile--{{ 'live' if project.status == 'live' else 'placeholder' }}"
         href="{{ url_for(project.endpoint) }}">
        <h2>{{ project.name }}</h2>
        <p>{{ project.description }}</p>
        <span class="tile-status">{{ project.status }}</span>
      </a>
    {% endfor %}
  </div>
{% endblock %}
